name: Verify Windows family installer
on:
  push:
    paths:
      - 'Install-XiangQingFu.*'
      - 'tests/**'
      - '.github/workflows/windows-setup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-51:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test on Windows PowerShell 5.1 and exercise CMD
        shell: powershell
        run: ./tests/windows-setup.Tests.ps1
